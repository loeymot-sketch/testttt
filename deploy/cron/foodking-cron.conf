# FoodKing crontab — alternative to systemd timer.
#
# Install (as root):
#   crontab -u foodking deploy/cron/foodking-cron.conf
#
# IMPORTANT: this file and the foodking-scheduler.timer / foodking-scheduler.service
# systemd units are MUTUALLY EXCLUSIVE. Running both will execute
# `php artisan schedule:run` twice per minute, which double-fires every job that
# was registered via $schedule->command(...) (including foodking:outbox:rescue
# and foodking:pusher:monitor). Pick ONE of:
#
#   (A) systemd-timer-based scheduling (preferred on Debian/Ubuntu/CentOS):
#       sudo systemctl enable --now foodking-scheduler.timer
#       (and DO NOT install this crontab)
#
#   (B) cron-based scheduling (use only when systemd is not available, e.g.
#       container without systemd, BSD host):
#       crontab -u foodking deploy/cron/foodking-cron.conf
#       (and DO NOT enable foodking-scheduler.timer)
#
# Adjust paths in this file if your install root differs from /home/foodking/foodking.

SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
MAILTO=ops@foodking.local

# --- Laravel scheduler ----------------------------------------------------
# Drives all $schedule->command(...) entries declared in app/Console/Kernel.php,
# including:
#   - foodking:outbox:rescue            (every minute)
#   - foodking:pusher:monitor           (every 5 min)
#   - foodking:cash:close-stale-sessions (daily 03:00)
#   - purge-expired-otps                (every 15 min)
#   - CleanupStalePendingKioskOrders    (every 5 min)
* * * * * cd /home/foodking/foodking && /usr/bin/php artisan schedule:run >> /var/log/foodking-scheduler.log 2>&1

# --- Daily DB backup at 02:00 ---------------------------------------------
# Runs the canonical mysqldump --single-transaction wrapper.
0 2 * * * /home/foodking/foodking/scripts/ops/backup-db.sh >> /var/log/foodking-backup.log 2>&1

# --- Soketi healthcheck every 5 min ---------------------------------------
# On failure, attempt one auto-restart (idempotent — systemd skips if already running).
*/5 * * * * /home/foodking/foodking/scripts/ops/healthcheck-soketi.sh >> /var/log/foodking-soketi-health.log 2>&1 || /usr/bin/systemctl --no-block restart foodking-soketi.service

# --- Outbox retry of failed events (hourly) -------------------------------
# Re-runs envelopes whose attempts >= 5 within the last hour. Keep manual
# (--since=1h) so a stuck broker does not feedback-loop into an infinite retry.
17 * * * * cd /home/foodking/foodking && /usr/bin/php artisan foodking:outbox:retry-failed --since=1h >> /var/log/foodking-outbox.log 2>&1
