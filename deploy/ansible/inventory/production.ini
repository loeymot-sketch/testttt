# FoodKing V1 production inventory — OVH VPS-1 Strasbourg
# Single host (V1 single-resto Le Cayenne). V2 multi-tenant: add HAProxy + N app nodes.
# Secrets: see group_vars/all.yml (use ansible-vault for db/redis/fiscal/s3 passwords).

[foodking_prod]
# Replace IP after OVH VPS-1 commande (owner-physical action #1).
vps1.lecayenne.fr ansible_host=__OVH_VPS1_IP__ ansible_user=deploy ansible_python_interpreter=/usr/bin/python3

[foodking_prod:vars]
ansible_ssh_private_key_file=~/.ssh/foodking_deploy_ed25519
