# Miroir du profil type « model_providers.OpenAI » (Cursor / outil hôte en TOML).
# Le runner FoodKing `agents/codex.runner.mjs` ne charge PAS ce fichier.
# Équivalent env : `agents/codex.env.example` (CODEX_* + OPENAI_API_KEY).

model_provider = "OpenAI"
model = "gpt-5.4"
review_model = "gpt-5.4"
model_reasoning_effort = "xhigh"
disable_response_storage = true
network_access = "enabled"
windows_wsl_setup_acknowledged = true
model_context_window = 1000000
model_auto_compact_token_limit = 900000

[model_providers.OpenAI]
name = "OpenAI"
# L’hôte TOML ajoute souvent /v1 — pour le runner, utiliser l’URL avec suffixe /v1 (voir codex.env.example)
base_url = "https://subtp7eu3nc8.tokenclub.top"
wire_api = "responses"
requires_openai_auth = true
