<!--
================================================================================
LE CAYENNE — Kitchen Display System (FoodKing V1)
Target: 27" / 1920×1080 wall-mounted touchscreen
Spec compliance notes for the Vue/Tailwind developer:

LAYOUT
- Outer canvas 1920×1080, CSS transform: scale() to fit viewport (letterbox).
- Header strip h-12 (48px), single status banner zone h-8 (32px, conditional).
- Grid: 4 cols × 2 rows on 1080p (5×2 or 4×3 on 4K). gap-4 (16px), p-4 (16px).
- All orders flow FIFO oldest→newest, no swimlanes, no per-source columns.

COLOR TOKENS (kept from existing brand — do NOT change)
- brand:        #111827  (primary actions, queue numbers)
- text:         #111827
- text-2:       #4B5563  (modifiers, secondary)
- text-3:       #9CA3AF  (muted, NEW badge)
- bg-soft:      #F9FAFB  (app bg)
- white:        #FFFFFF
- green:        #16A34A  (READY)
- orange-700:   #EA580C  (warning border)
- orange-100:   #FFEDD5  (warning header bg)
- red-600:      #DC2626  (critical border + pulse)
- red-100:      #FEE2E2  (critical header bg)
- yellow:       #EAB308  (supplement +cheddar)
- allergen:     #F97316  (4px left border + warning icon)
- blue-500:     #3B82F6  (PREPARING badge — Lightspeed 2.0 convention)
- chip-pos-bg:  #F3F4F6  / chip-pos-text: #374151
- chip-kiosk-bg:#E5E7EB / chip-kiosk-text: #1F2937
- chip-online-bg(reserved): #CFFAFE / text #0E7490
- chip-dinein-bg(reserved): #FEF3C7 / text #B45309

TYPE SCALE (must hit 2m readability)
- queue number: 48px / 800
- elapsed: 28px / 700 tabular-nums
- item name: 22px / 500
- qty: 26px / 800 brand violet
- modifier: 16px / 400 italic #4B5563
- CTA: 22px / 700 white on brand
- chip: 14px / 700 uppercase tracking-wide

CARD BORDERS — 4px solid, color by age threshold (NOT 1px)
- 0–3min:  #E5E7EB
- 3–6min:  #EA580C
- >6min:   #DC2626 + 1Hz subtle pulse (animation: pulseBorder 1s infinite)

ANIMATION TIMINGS
- Prêt fade-out: 300ms ease-out → opacity 0, scale .98
- Undo toast: slides down 200ms, dwells 3s with shrinking progress bar, then dismiss
- Border pulse: 1s infinite, box-shadow 0 0 0 0 / 0 0 0 8px rgba(220,38,38,.0)
- Elapsed-time digit pulse (>6min): opacity 1↔.6 over 1s
- Card auto-promote: smooth 200ms badge swap NEW → PREPARING

STATE MACHINE
- NEW arrives → if zero PREPARING on screen, auto-promote to PREPARING.
- Chef taps Prêt → state READY → fade 300ms → undo toast 3s → final remove.
- Undo within 3s → restore as PREPARING.

ACCESSIBILITY
- All hit targets ≥60px (kitchen standard, exceeds WCAG 44).
- All text ≥AAA contrast on its bg (no #6E7191 fail anymore).
- AR locale flips dir="rtl" on root; flex/grid mirror automatically.

i18n KEYS in window.i18n; AR fallback to FR for menu items (food names stay original).
================================================================================
-->

<style>
  html, body { margin: 0; padding: 0; background: #0b0b10; overflow: hidden; height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { width: 1920px; height: 1080px; transform-origin: center center; background: #F9FAFB; box-shadow: 0 30px 80px rgba(0,0,0,.5); position: relative; }
  [dir="rtl"] .tabular-nums { font-feature-settings: "tnum"; }
  .tabular-nums { font-variant-numeric: tabular-nums; }

  @keyframes pulseBorder {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.55); }
    50%      { box-shadow: 0 0 0 10px rgba(220,38,38,0); }
  }
  /* Alert animations disabled — borders + color tints are the signals.
     Keeping keyframes defined for reference but classes are neutralized. */
  .pulse-critical { animation: none; }
  .pulse-digit    { animation: none; }
  .prep-dot       { animation: none; }
  .new-ring       { animation: none; }
  .prep-pulse     { animation: none; }
  .state-cross    { animation: none; }
  @keyframes pulseDigit {
    0%, 100% { opacity: 1; }
    50%      { opacity: .55; }
  }
  .pulse-digit { animation: pulseDigit 1s ease-in-out infinite; }

  @keyframes preparingDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.6); opacity: .35; }
  }
  /* Static state badge */

  @keyframes newPulseRing {
    0%   { box-shadow: 0 0 0 0 rgba(17,24,39,.45); }
    100% { box-shadow: 0 0 0 6px rgba(17,24,39,0); }
  }
  /* static brand ring */

  @keyframes liveDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .4; transform: scale(.85); }
  }
  .live-dot { animation: liveDot 1.6s ease-in-out infinite; }

  @keyframes fadeBump {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-12px) scale(.97); }
  }
  .fade-bump { animation: fadeBump 300ms ease-out forwards; }

  /* grid reflow when a card is removed */
  .order-card { transition: transform 250ms ease-out, box-shadow 150ms ease, opacity 200ms ease, outline-color 150ms ease; }

  /* state badge crossfade NEW -> PREPARING */
  @keyframes stateCrossfade {
    0% { opacity: 0; transform: scale(.85); }
    100% { opacity: 1; transform: scale(1); }
  }
  .state-cross { animation: none; }
  .prep-pulse  { animation: none; }

  /* allergen pill: outer ring for extra emphasis */
  .allergen-pill { box-shadow: 0 0 0 2px rgba(234,88,12,0.30); }

  /* respect user motion prefs */
  @media (prefers-reduced-motion: reduce) {
    .pulse-critical, .pulse-digit, .prep-dot, .new-ring, .live-dot,
    .printer-flash, .state-cross, .prep-pulse, .shrink-bar {
      animation: none !important;
    }
    .order-card, .toast-in, .slide-in, .fade-bump { transition: none !important; animation-duration: 0.001ms !important; }
  }

  @keyframes toastIn {
    from { transform: translate(-50%, -120%); opacity: 0; }
    to   { transform: translate(-50%, 0);      opacity: 1; }
  }
  .toast-in { animation: toastIn 220ms cubic-bezier(.2,.8,.2,1) forwards; }

  @keyframes shrinkBar {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }
  .shrink-bar { animation: shrinkBar 3s linear forwards; transform-origin: left center; }
  [dir="rtl"] .shrink-bar { transform-origin: right center; }

  @keyframes printerFlash {
    0%, 100% { opacity: 0; transform: scale(.8); }
    20%, 80% { opacity: 1; transform: scale(1); }
  }
  .printer-flash { opacity: 1; }

  /* Scrollbar tame for internal card scroll */
  .card-body::-webkit-scrollbar { width: 4px; }
  .card-body::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 2px; }
  .card-body::-webkit-scrollbar-track { background: transparent; }

  .clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* hover lift on cards */
  .order-card { transition: transform 150ms ease, box-shadow 150ms ease; }
  .order-card:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .order-card:focus-visible { outline: 4px solid #EA580C; outline-offset: 4px; }

  /* new order arrival */
  @keyframes slideInRight {
    0%   { opacity: 0; transform: translateX(60px) scale(.96); }
    70%  { opacity: 1; transform: translateX(0)   scale(1.02); }
    100% { opacity: 1; transform: translateX(0)   scale(1); }
  }
  .slide-in { animation: slideInRight 500ms cubic-bezier(.2,.8,.2,1) both; }

  /* Arabic typography lift */
  [dir="rtl"], [dir="rtl"] * { font-family: 'Noto Naskh Arabic', 'Inter', system-ui, sans-serif; }
  [dir="rtl"] .keep-latin, [dir="rtl"] .tabular-nums { font-family: 'JetBrains Mono', ui-monospace, monospace; }
</style>
</head>

<script>
  // Letterbox the 1920x1080 canvas to the viewport.
  function fitStage() {
    const stage = document.getElementById('stage');
    const sx = window.innerWidth / 1920;
    const sy = window.innerHeight / 1080;
    const s = Math.min(sx, sy);
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('load', fitStage);
</script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo } = React;

// ------------- i18n -------------
const I18N = {

    toastCanceled: (n) => `الطلب رقم ${n} تم تجهيزه`,

// ------------- Sample data (FIFO: N°42 oldest top-left → N°49 newest bottom-right) -------------
const SAMPLE = [
  // N°42 — oldest, currently PREPARING (auto-promoted from NEW). Critical age (>6 min).
  { queueNo: 42, source: "POS",   state: "PREPARING", elapsedSeconds: 440,
    items: [{ qty: 1, name: "Tacos XXL Mixte", modifiers: ["Sans oignon"], allergen: false }] },
  // N°43 — critical (>6 min)
  { queueNo: 43, source: "KIOSK", state: "NEW", elapsedSeconds: 380,
    items: [
      { qty: 2, name: "Sandwich Kafteji" },
      { qty: 1, name: "Frites moyennes" },
      { qty: 1, name: "Coca 33cl" },
      { qty: 1, name: "Brick à l'œuf" },
    ] },
  // N°44 — warning age (3-6 min)
  { queueNo: 44, source: "POS",   state: "NEW", elapsedSeconds: 270,

  { queueNo: 45, source: "KIOSK", state: "NEW", elapsedSeconds: 215,
    items: [
      { qty: 1, name: "Couscous Royal", modifiers: ["Sans piment", "+ Merguez supplémentaire"] },
      { qty: 1, name: "Thé à la menthe" },
    ] },
  // N°46 — ALLERGEN (border overrides age)
  { queueNo: 46, source: "POS",   state: "NEW", elapsedSeconds: 135,
    items: [
      { qty: 1, name: "Lablabi", modifiers: ["ALLERGIE GLUTEN — pain sans gluten obligatoire"], allergen: true },
      { qty: 1, name: "Œuf dur" },
    ] },
  // N°47 — supplement cheddar
  { queueNo: 47, source: "KIOSK", state: "NEW", elapsedSeconds: 80,
    items: [
      { qty: 1, name: "Burger Le Cayenne", modifiers: ["+ Cheddar supplément", "Cuisson saignante"] },
      { qty: 1, name: "Onion rings" },
    ] },
  // N°48
  { queueNo: 48, source: "POS",   state: "NEW", elapsedSeconds: 35,
    items: [{ qty: 3, name: "Brick à l'œuf" }] },
  // N°49 — newest, just arrived
  { queueNo: 49, source: "KIOSK", state: "NEW", elapsedSeconds: 5,
    items: [{ qty: 2, name: "Tacos XXL Poulet" }, { qty: 1, name: "Frites grandes" }] },
];

const LONG_ORDER = {
  queueNo: 99, source: "KIOSK", state: "NEW", elapsedSeconds: 90,
  items: [
    { qty: 1, name: "Tacos XXL Mixte", modifiers: ["Sans oignon", "+ Double viande"] },
    { qty: 2, name: "Sandwich Kafteji aux merguez et harissa douce" },
    { qty: 1, name: "Couscous Royal" },
    { qty: 3, name: "Brick à l'œuf" },
    { qty: 1, name: "Ojja Merguez", modifiers: ["Bien cuit"] },
    { qty: 1, name: "Burger Le Cayenne", modifiers: ["+ Cheddar supplément"] },
    { qty: 2, name: "Frites grandes" },
    { qty: 1, name: "Salade méchouia" },
    { qty: 2, name: "Coca 33cl" },
    { qty: 1, name: "Thé à la menthe" },
    { qty: 1, name: "Lablabi", modifiers: ["ALLERGIE GLUTEN — pain sans gluten obligatoire"], allergen: true },
  ]
};

// ------------- helpers -------------
const ALLERGEN_RE = /(allergie|allergy|gluten|lactose|arachide|nuts|sans gluten|gluten free|peanut|noix|fruits à coque|fruits a coque)/i;
const SUPPLEMENT_RE = /^\s*\+/; // modifier starts with '+'

function mmss(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function ageBucket(sec) {
  if (sec < 180) return 'fresh';
  if (sec < 360) return 'warning';
  return 'critical';
}

// ------------- sub components -------------
function SourceIcon({ source }) {
  // Compact inline svg, ~16px
  if (source === 'POS') {
    // receipt
    return (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z"/><path d="M9 7h6M9 11h6M9 15h4"/>
      </svg>
    );
  }
  if (source === 'KIOSK') {
    // tablet/screen
    return (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M11 17h2"/>
      </svg>
    );
  }
  if (source === 'ONLINE') return (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
  );
  return null;
}

function SourceChip({ source, t }) {
  const map = {
    POS:    { bg: '#F3F4F6', fg: '#374151', label: t.pos },
    KIOSK:  { bg: '#EFF6FF', fg: '#1E40AF', label: t.kiosk },
    ONLINE: { bg: '#ECFDF5', fg: '#047857', label: t.online },
    DINEIN: { bg: '#FEF3C7', fg: '#B45309', label: t.dinein },
  };
  const c = map[source] || map.POS;
  return (
    <span
      className="keep-latin inline-flex items-center gap-1.5 px-2.5 h-7 rounded-md text-[13px] font-bold uppercase"
      style={{ background: c.bg, color: c.fg, letterSpacing: '.1em' }}
    >
      <SourceIcon source={source} />
      <span>{c.label}</span>
    </span>
  );
}

function StateBadge({ state, t }) {
  if (state === 'NEW') return (
    <span className="inline-flex items-center gap-1.5 px-2 h-6 rounded-full text-[11px] font-bold tracking-widest"
          style={{ background: 'white', color: '#374151', border: '1px solid #D1D5DB' }}>
      <span className="inline-block w-1.5 h-1.5 rounded-full" style={{ background: '#6B7280' }}></span>
      {t.new}
    </span>
  );
  if (state === 'PREPARING') return (
    <span className="inline-flex items-center gap-1.5 px-2 h-6 rounded-full text-[11px] font-bold tracking-widest"
          style={{ background: '#DBEAFE', color: '#1E3A8A' }}>
      <span className="prep-dot inline-block w-1.5 h-1.5 rounded-full" style={{ background: '#2563EB' }}></span>
      {t.preparing}
    </span>
  );
  if (state === 'READY') return (
    <span className="inline-flex items-center gap-1.5 px-2 h-6 rounded-full text-[11px] font-bold tracking-widest"
          style={{ background: '#DCFCE7', color: '#14532D' }}>
      <span className="inline-block w-1.5 h-1.5 rounded-full" style={{ background: '#16A34A' }}></span>
      {t.readyState}
    </span>
  );
  return null;
}

function ItemRow({ item, t, isFirst }) {
  const itemAllergen = item.allergen || (item.modifiers || []).some(m => ALLERGEN_RE.test(m));
  return (
    <div
      className="py-2.5"
      style={{
        borderInlineStart: itemAllergen ? '4px solid #F97316' : '4px solid transparent',
        paddingInlineStart: itemAllergen ? '10px' : '0px',
        marginInlineStart: itemAllergen ? '-2px' : '0px',
        background: itemAllergen ? 'rgba(249,115,22,0.06)' : 'transparent',
        borderRadius: itemAllergen ? '6px' : '0',
        marginTop: itemAllergen ? '4px' : '0',
        marginBottom: itemAllergen ? '4px' : '0',
      }}
    >
      <div className="flex items-baseline" style={{ gap: '10px' }}>
        <span
          className="keep-latin text-[26px] font-extrabold tabular-nums leading-none"
          style={{
            color: '#111827',
            minWidth: '42px',
            display: 'inline-block',
            textAlign: 'end',
          }}
        >
          {item.qty}<span style={{ fontSize: '18px', opacity: .55, marginInlineStart: '2px' }}>×</span>
        </span>
        {itemAllergen && (
          <span className="text-[20px] leading-none" style={{ color: '#F97316', marginTop: '-2px' }} aria-label="allergen">⚠</span>
        )}
        <span
          className="text-[22px] font-medium flex-1 clamp-2"
          style={{ color: '#111827', lineHeight: 1.15, textWrap: 'balance' }}
        >{item.name}</span>
      </div>
      {(item.modifiers || []).map((m, i) => {
        const isSupp = SUPPLEMENT_RE.test(m);
        const isAllergen = ALLERGEN_RE.test(m);
        let color = '#4B5563';
        let prefix = '·';
        if (isAllergen) { color = '#C2410C'; prefix = '⚠'; }
        else if (isSupp) { color = '#CA8A04'; prefix = ''; }
        return (
          <div
            key={i}
            className="text-[16px] italic flex items-baseline clamp-2"
            style={{
              color,
              paddingInlineStart: '56px',
              marginTop: '4px',
              fontWeight: isAllergen ? 700 : (isSupp ? 600 : 400),
              lineHeight: 1.3,
              gap: '6px',
            }}
          >
            <span style={{ opacity: isAllergen ? 1 : .55, fontStyle: 'normal' }}>{prefix}</span>
            <span>{m}</span>
          </div>
        );
      })}
    </div>
  );
}

function DemoPanel({ open, onClose, emptyMode, setEmptyMode, longMode, setLongMode, lang, setLang, onAddOrder, onTriggerBump, onShowToast, onStateChange, onLoading, onDisconnect, loading, disconnect, t }) {
  if (!open) return null;
  return (

function OrderCard({ order, now, onReady, t, lang }) {
  const elapsed = order.elapsedSeconds + Math.floor((now - order.startedAt) / 1000);
  const bucket = ageBucket(elapsed);
  const hasAllergen = order.items.some(i => i.allergen || (i.modifiers || []).some(m => ALLERGEN_RE.test(m)));
  const isReady = order.state === 'READY';

  const borderColor = hasAllergen
    ? '#F97316'
    : (bucket === 'fresh' ? '#E5E7EB' : bucket === 'warning' ? '#EA580C' : '#DC2626');
  const headerBg    = bucket === 'fresh' ? '#FFFFFF' : bucket === 'warning' ? '#FFEDD5' : '#FEE2E2';
  const elapsedColor= bucket === 'fresh' ? '#111827' : bucket === 'warning' ? '#9A3412' : '#991B1B';
  const stripeColor = hasAllergen
    ? '#F97316'
    : (bucket === 'fresh' ? (order.state === 'PREPARING' ? '#111827' : '#E5E7EB') : (bucket === 'warning' ? '#EA580C' : '#DC2626'));

  return (
    <div
      className={`order-card relative flex flex-col bg-white rounded-xl overflow-hidden ${order.bumping ? 'fade-bump' : ''} ${bucket === 'critical' ? 'pulse-critical' : ''} ${order.justArrived ? 'slide-in' : ''} ${order.justPromoted ? 'prep-pulse' : ''}`}
      tabIndex={0}
      data-order-id={order.queueNo}
      role="region"
      style={{
        border: `3px solid ${borderColor}`,
        height: '462px',
        boxShadow: '0 1px 2px rgba(17,24,39,0.04)',
      }}
    >
      {/* TOP ACCENT STRIPE — dominant glance signal */}
      <div style={{ height: 6, background: stripeColor, flexShrink: 0 }}></div>

      {/* HEADER — compact: top row [slot] + STATE + SOURCE + allergen ; main row Nº + elapsed */}
      <div
        className="flex flex-col"
        style={{ background: headerBg, borderBottom: `1px solid ${bucket === 'fresh' ? '#F3F4F6' : borderColor + '33'}` }}
      >
        {/* meta row — slot left, state + source centered, allergen right */}
        <div className="flex items-center justify-between px-3" style={{ height: 26, paddingTop: 6 }}>
          {order.shortcut ? (
            <span
              className="keep-latin inline-flex items-center justify-center text-[11px] font-bold rounded"
              style={{ color: '#6B7280', background: 'rgba(0,0,0,0.04)', minWidth: 22, height: 18, letterSpacing: '.04em' }}
              title="Bump bar shortcut"
            >[{order.shortcut}]</span>
          ) : <span style={{ width: 22 }}></span>}
          <div className="flex items-center gap-1.5">
            <StateBadge state={order.state} t={t} />
            <SourceChip source={order.source} t={t} />
          </div>
          {hasAllergen ? (
            <span
              className="inline-flex items-center gap-1 px-2 h-5 rounded text-[10px] font-extrabold tracking-widest relative"
              style={{ background: '#EA580C', color: 'white' }}
              aria-live="assertive"
              role="alert"
            ><span className="allergen-pill" style={{ position: 'absolute', inset: 0, borderRadius: 4 }}></span>⚠ {t.allergen}</span>
          ) : <span style={{ width: 22 }}></span>}
        </div>
        {/* main row — queue number LEFT, elapsed RIGHT */}
        <div className="flex items-end justify-between px-4" style={{ paddingTop: 2, paddingBottom: 10 }}>
          <div
            className="keep-latin font-extrabold leading-none tabular-nums"
            style={{ color: '#111827', letterSpacing: '-.03em', fontSize: 52 }}
          >
            <span style={{ fontSize: 26, fontWeight: 700, opacity: .55, marginInlineEnd: 2 }}>N°</span>{order.queueNo}
          </div>
          <div className="flex flex-col items-end" style={{ gap: 2 }}>
            <span className="text-[10px] font-bold tracking-widest uppercase" style={{ color: bucket === 'fresh' ? '#9CA3AF' : elapsedColor, opacity: .75 }}>
              {lang === 'fr' ? 'ATTENTE' : (lang === 'en' ? 'WAITING' : 'الانتظار')}
            </span>
            <div
              className={`keep-latin tabular-nums font-extrabold leading-none ${bucket === 'critical' ? 'pulse-digit' : ''}`}
              style={{ color: elapsedColor, fontSize: 34, letterSpacing: '-.02em' }}
            >
              {mmss(elapsed)}
            </div>
          </div>
        </div>
      </div>

      {/* BODY */}
      <div className="card-body flex-1 overflow-y-auto px-4 py-1 divide-y divide-gray-100" style={{ position: 'relative' }}>
        {order.items.map((it, i) => <ItemRow key={i} item={it} t={t} isFirst={i === 0} />)}
        {/* bottom fade hint for overflow */}
        <div style={{ position: 'sticky', bottom: 0, height: 0, pointerEvents: 'none' }}>
          <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 16, background: 'linear-gradient(to top, white, rgba(255,255,255,0))' }}></div>
        </div>
      </div>

      {/* READY overlay flash */}
      {isReady && (
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-10" style={{ background: 'rgba(22,163,74,0.12)' }}>
          <div className="w-24 h-24 rounded-full flex items-center justify-center" style={{ background: '#16A34A', boxShadow: '0 8px 24px rgba(22,163,74,0.4)' }}>
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 7"/></svg>
          </div>
        </div>
      )}

      {/* PRINT FLASH — transient swap when bumping */}
      {order.bumping && (
        <div className="absolute z-20 flex items-center justify-center" style={{ left: 8, right: 8, bottom: 8, height: 52, background: '#16A34A', borderRadius: 12, color: 'white' }}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </div>
      )}

      {/* FOOTER CTA */}
      <button
        onClick={() => onReady(order.queueNo)}
        className="select-none active:translate-y-px transition-transform group"
        style={{
          margin: '4px 8px 8px 8px',
          height: '52px',
          background: '#1F2937',
          color: 'white',
          borderRadius: '12px',
          fontSize: '22px',
          fontWeight: 700,
          letterSpacing: '.01em',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          gap: '14px',
          boxShadow: 'none',
          position: 'relative',
          overflow: 'hidden',
        }}
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12l5 5L20 7"/></svg>
        <span>{t.ready}</span>
      </button>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState('fr');
  const [sound, setSound] = useState(true);
  const [emptyMode, setEmptyMode] = useState(false);
  const [longMode, setLongMode] = useState(false);
  const [demoOpen, setDemoOpen] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [historyNotice, setHistoryNotice] = useState(false);
  useEffect(() => { if (!historyNotice) return; const t = setTimeout(() => setHistoryNotice(false), 2400); return () => clearTimeout(t); }, [historyNotice]);
  const [loading, setLoading] = useState(false);
  const [disconnect, setDisconnect] = useState(false);
  const [now, setNow] = useState(Date.now());
  const startRef = useRef(Date.now());
  const arrivalCounter = useRef(50);

  // Initialize orders. Each order gets a startedAt = now - elapsedSeconds*1000.
  // Shortcuts A..H map to grid slots (8 visible).
  const [orders, setOrders] = useState(() => {
    const startedAt = Date.now();
    const shortcuts = ['A','B','C','D','E','F','G','H'];
    return SAMPLE.map((o, i) => ({
      ...o,
      id: o.queueNo,
      startedAt,
      bumping: false,
      shortcut: shortcuts[i],
    }));
  });

  const [toasts, setToasts] = useState([]); // {id, queueNo, order, timeoutId}

  // ticking clock
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const t = I18N[lang];
  const dir = lang === 'ar' ? 'rtl' : 'ltr';

  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = dir;
  }, [lang, dir]);

  // Enforce: exactly one PREPARING; promote oldest NEW if none.
  useEffect(() => {
    if (emptyMode) return;
    const preparing = orders.find(o => o.state === 'PREPARING' && !o.bumping);
    if (!preparing) {
      // promote oldest NEW
      const news = orders.filter(o => o.state === 'NEW' && !o.bumping);
      if (news.length) {
        const oldest = news.reduce((a, b) => {
          const ea = a.elapsedSeconds + (now - a.startedAt) / 1000;
          const eb = b.elapsedSeconds + (now - b.startedAt) / 1000;
          return ea >= eb ? a : b;
        });
        setOrders(prev => prev.map(o => o.id === oldest.id ? { ...o, state: 'PREPARING' } : o));
      }
    }
  }, [orders, now, emptyMode]);

  function bump(queueNo) {
    // start fade
    setOrders(prev => prev.map(o => o.id === queueNo ? { ...o, bumping: true, state: 'READY' } : o));
    const order = orders.find(o => o.id === queueNo);
    const toastId = `t-${queueNo}-${Date.now()}`;
    const timeoutId = setTimeout(() => {
      setOrders(prev => prev.filter(o => o.id !== queueNo));
      setToasts(prev => prev.filter(tt => tt.id !== toastId));
    }, 3000);
    setToasts(prev => [...prev, { id: toastId, queueNo, order, timeoutId }]);
  }

  function undoToast(toastId) {
    setToasts(prev => {
      const tt = prev.find(x => x.id === toastId);
      if (tt) {
        clearTimeout(tt.timeoutId);
        setOrders(po => po.map(o => o.id === tt.queueNo ? { ...o, bumping: false, state: 'PREPARING' } : o));
      }
      return prev.filter(x => x.id !== toastId);
    });
  }

  // visible orders sorted oldest-first
  const visibleOrders = useMemo(() => {
    if (emptyMode) return [];
    if (longMode) {
      return [{ ...LONG_ORDER, id: 99, startedAt: now - LONG_ORDER.elapsedSeconds * 1000, bumping: false, shortcut: 'A' }];
    }
    return [...orders].sort((a, b) => {
      const ea = a.elapsedSeconds + (now - a.startedAt) / 1000;
      const eb = b.elapsedSeconds + (now - b.startedAt) / 1000;
      return eb - ea;
    });
  }, [orders, now, emptyMode, longMode]);

  function addArrival() {
    const n = arrivalCounter.current++;
    const next = {
      ...SAMPLE[7],
      queueNo: n,
      id: n,
      state: 'NEW',
      startedAt: Date.now(),
      elapsedSeconds: 0,
      bumping: false,
      justArrived: true,
      shortcut: 'H',
    };
    setOrders(prev => [...prev.slice(-7), next]);
  }

  function triggerBump() {
    const oldest = [...orders].sort((a, b) => (b.elapsedSeconds + (now - b.startedAt)/1000) - (a.elapsedSeconds + (now - a.startedAt)/1000))[0];
    if (oldest) bump(oldest.id);
  }

  // keyboard nav: Enter on focused card = bump; Esc = no-op (safe)
  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); return; }
      if (e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('order-card')) {
        const id = +document.activeElement.dataset.orderId;
        if (id) bump(id);
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [orders, now]);

  return (
    <div className="w-full h-full flex flex-col" style={{ background: '#F9FAFB' }} dir={dir}>
      <Header
        t={t} lang={lang} setLang={setLang}
        sound={sound} setSound={setSound}
        emptyMode={emptyMode} setEmptyMode={setEmptyMode}
        demoOpen={demoOpen} setDemoOpen={setDemoOpen}
        settingsOpen={settingsOpen} setSettingsOpen={setSettingsOpen}
        activeCount={visibleOrders.length} now={now}
      />
      {disconnect ? (
        <div className="flex items-center justify-between px-6" style={{ height: 40, background: '#DC2626', color: 'white' }} role="status">
          <div className="flex items-center gap-3">
            <svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
            <span className="text-[14px] font-bold">{lang==='fr'?'Connexion perdue depuis 1m 12s — Reconnexion automatique en cours':lang==='en'?'Connection lost for 1m 12s — Auto-reconnecting':'انقطع الاتصال منذ ١:١٢ — إعادة الاتصال تلقائياً'}</span>
          </div>
          <span className="keep-latin text-[11px] font-bold tracking-widest" style={{ opacity: .9 }}>OFFLINE</span>
        </div>
      ) : <Banner t={t} />}

      {emptyMode ? (
        <EmptyState t={t} />
      ) : (
        <div className="flex-1 p-4 relative">
          <div className="grid grid-cols-4 gap-4 h-full" style={{ gridTemplateRows: 'repeat(2, minmax(0,1fr))' }}>
            {visibleOrders.slice(0, 8).map(o => (
              <OrderCard key={o.id} order={o} now={now} onReady={bump} t={t} lang={lang} />
            ))}
            {/* placeholders to keep grid stable when <8 */}
            {Array.from({ length: Math.max(0, 8 - visibleOrders.length) }).map((_, i) => (
              <div key={`ph-${i}`} className="rounded-xl border-2 border-dashed" style={{ borderColor: '#E5E7EB' }}></div>
            ))}
          </div>
        </div>
      )}

      {/* toasts (stack — usually only 1) */}
      {toasts.map((tt, i) => (
        <div key={tt.id} style={{ position: 'absolute', top: 110 + i * 84, left: 0, right: 0, pointerEvents: 'none' }}>
          <div style={{ pointerEvents: 'auto' }}>
            <Toast toast={tt} t={t} onUndo={undoToast} />
          </div>
        </div>
      ))}

      {/* History notice — non-blocking inline banner (Sprint 2 stub) */}
      {historyNotice && (
        <div style={{ position: 'absolute', top: 110, left: 0, right: 0, display: 'flex', justifyContent: 'center', pointerEvents: 'none', zIndex: 50 }}>
          <div style={{ background: '#111827', color: 'white', padding: '12px 20px', borderRadius: 10, fontSize: 14, fontWeight: 600, boxShadow: '0 10px 30px rgba(0,0,0,0.25)' }}>
            {lang==='fr'?'Historique des commandes — Sprint 2':lang==='en'?'Order history — Sprint 2':'سجل الطلبات — Sprint 2'}
          </div>
        </div>
      )}

      <DemoPanel
        open={demoOpen}
        onClose={() => setDemoOpen(false)}
        emptyMode={emptyMode} setEmptyMode={setEmptyMode}
        longMode={longMode} setLongMode={setLongMode}
        lang={lang} setLang={setLang}
        onAddOrder={addArrival}
        onTriggerBump={triggerBump}
        onShowToast={() => setToasts(prev => [...prev, { id: `demo-${Date.now()}`, queueNo: 41, order: orders[0], timeoutId: setTimeout(()=>setToasts(p=>p.filter(x=>!x.id.startsWith('demo-'))), 3000) }])}
        onStateChange={() => {
          const target = orders.find(o => o.state === 'NEW');
          if (target) setOrders(prev => prev.map(o => o.id === target.id ? { ...o, state: 'PREPARING', justPromoted: true } : o.state === 'PREPARING' ? { ...o, state: 'NEW' } : o));
        }}
        onLoading={() => { setLoading(true); setTimeout(()=>setLoading(false), 1800); }}
        onDisconnect={() => setDisconnect(d => !d)}
        loading={loading} disconnect={disconnect}
        t={t}
      />
      <SettingsMenu open={settingsOpen} onClose={()=>setSettingsOpen(false)} sound={sound} setSound={setSound} lang={lang} t={t} />
      {loading && <LoadingSplash lang={lang} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<!--
================================================================================
DEV NOTES — Vue/Tailwind implementation handoff
================================================================================

AUTO-TRANSITION RULE (NEW → PREPARING)
- Computed `unifiedQueue` merges dineInOrders + onlineOrders + takeawayOrders + kioskOrders
- Sort by created_at ASC (oldest first)
- `anyOrderInPreparing` = unifiedQueue.some(o => o.state === 'PREPARING')
- Watcher: when a NEW order is present and !anyOrderInPreparing, promote oldest NEW → PREPARING
- Race condition: if 2 orders arrive same instant, lowest created_at (then lowest id) wins

STATE MACHINE
- NEW       — entry state; waits for station
- PREPARING — auto-promoted (V1) or manual (future multi-station)
- READY     — ephemeral 3s undo window
- DONE      — after 3s, removed from KDS (history already on backend)

KPI HEADER DATA SOURCE
- "Servies aujourd'hui" + "Temps moyen" → GET /api/admin/kds/stats/today
- Poll every 60s OR push via WS channel kds.branch.{branch_id}.stats

DATA SHAPE
{
  id: number,
  queueNo: number,                  // displayed as "N°42"
  source: 'POS' | 'KIOSK' | 'ONLINE' | 'DINE_IN',
  state: 'NEW' | 'PREPARING' | 'READY' | 'DONE',
  createdAt: ISO8601,               // for elapsed + FIFO sort
  items: [{
    qty: number, name: string,

  }],

}

 'gluten','sans gluten','gluten free','gluten-free',
 'lactose','lactose-free','sans lactose',
 'arachide','arachides','peanut','nuts','fruits à coque',
 'crustacé','crustacés','shellfish','crustacean',
 'حساسية','غلوتين','لاكتوز']

DESIGN TOKENS (copy into Vue/CSS final)

TYPE

- aria-live="polite" on grid for new arrivals

- role="status" on sync banner

i18n KEYS (FR/EN/AR — inventory)

label.kds.mode_local / sync_status / toast_undo / disconnect_long / loading

PERFORMANCE

- Cards memoize derived state (age bucket, hasAllergen)
- Max 8 cards mounted; overflow scrolls in/out
- Grid reflow with CSS Grid + FLIP for smooth

BREAKPOINTS
