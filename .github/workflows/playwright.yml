name: Playwright E2E

on:
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Same non-sentinel secrets as phpunit.xml / docs: required because this
    # job runs a real `php artisan serve` (APP_ENV=local from .env.example).
    # phpunit.xml env does NOT apply here — empty FISCAL_* in .env breaks
    # POS flows that call AuditLogService (422/500 → Playwright failures).
    env:
      FISCAL_AUDIT_SECRET: testing-fiscal-audit-secret-padding-48chars-ok
      FISCAL_Z_REPORT_SECRET: testing-fiscal-zreport-secret-padding-48chars-ok
      PRICING_USE_SSOT: "true"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foodking_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, redis

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Setup env
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=foodking_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i 's|^APP_URL=.*|APP_URL=http://localhost:8000|' .env
          # Persist fiscal secrets in .env so `config:cache` / Mix / sub-processes
          # match the job env (Dotenv does not override existing vars, but the
          # file keeps local `artisan` invocations self-consistent).
          sed -i 's/^FISCAL_AUDIT_SECRET=.*/FISCAL_AUDIT_SECRET=testing-fiscal-audit-secret-padding-48chars-ok/' .env
          sed -i 's/^FISCAL_Z_REPORT_SECRET=.*/FISCAL_Z_REPORT_SECRET=testing-fiscal-zreport-secret-padding-48chars-ok/' .env

      - name: Migrate and seed
        run: php artisan migrate:fresh --seed

      - name: Install Node dependencies and build
        run: |
          npm ci
          npm run prod

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: php artisan serve &
        env:
          APP_URL: http://localhost:8000
          FISCAL_AUDIT_SECRET: testing-fiscal-audit-secret-padding-48chars-ok
          FISCAL_Z_REPORT_SECRET: testing-fiscal-zreport-secret-padding-48chars-ok
          PRICING_USE_SSOT: "true"

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8000 > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/antigravity/
