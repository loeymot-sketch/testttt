name: PHPUnit (MySQL)

# Kiosk Phase 9.1.14 — Contract tests for channel/surface filtering rely on
# MySQL JSON functions (JSON_CONTAINS). Running them on SQLite was masking
# a real regression (`whereJsonContains` does not translate to a valid SQLite
# predicate on the `channels` column, yielding HTTP 422 on `?surface=kiosk`).
# This workflow forces the full PHPUnit suite to run against MySQL 8.0, which
# mirrors production and catches SSOT filtering bugs before merge.
#
# Local developers can keep using SQLite; the 3 affected tests
# (`FrontendSurfaceFilteringTest::test_item_list_with_surface_*`,
#  `test_category_list_with_surface_*`) will auto-skip on non-MySQL drivers
# with a clear message (see the test class).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # E04 (méga-checklist) : scripts/check-invariants.sh (6 greps) — bloque le merge sur régression.
  # P11 / KI-001 : Order* utilise DispatchableAfterCommit ; le script filtre les faux positifs
  # (grep « DB::afterCommit » au-dessus du call site) + jamais event(new Order*) (contourne le trait).
  invariants-grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: POS invariants (grep) — E04
        run: bash scripts/check-invariants.sh

  phpunit-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foodking_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: foodking_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      APP_ENV: testing
      BCRYPT_ROUNDS: 4
      MIX_API_KEY: test-api-key
      STAFF_ONLY_MODE: 'false'
      KIOSK_USE_POS_WIZARD: 'false'
      KIOSK_MACHINE_USERNAME: kiosk-lecayenne
      KIOSK_MACHINE_PASSWORD: kiosk123
      PRICING_USE_SSOT: 'true'
      # Defense in depth (same values as phpunit.xml): some subprocesses or
      # future bootstrap paths read getenv before PHPUnit injects xml env.
      FISCAL_AUDIT_SECRET: testing-fiscal-audit-secret-padding-48chars-ok
      FISCAL_Z_REPORT_SECRET: testing-fiscal-zreport-secret-padding-48chars-ok

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, redis, bcmath, intl, mbstring, xml, zip, json
          tools: composer:v2

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root -proot --silent && exit 0
            echo "waiting mysql ($i)..."
            sleep 1
          done
          exit 1

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          php -r "
            \$f='.env';
            \$c=file_get_contents(\$f);
            \$c=preg_replace('/^DB_CONNECTION=.*/m','DB_CONNECTION=mysql',\$c);
            \$c=preg_replace('/^DB_HOST=.*/m','DB_HOST=127.0.0.1',\$c);
            \$c=preg_replace('/^DB_PORT=.*/m','DB_PORT=3306',\$c);
            \$c=preg_replace('/^DB_DATABASE=.*/m','DB_DATABASE=foodking_test',\$c);
            \$c=preg_replace('/^DB_USERNAME=.*/m','DB_USERNAME=root',\$c);
            \$c=preg_replace('/^DB_PASSWORD=.*/m','DB_PASSWORD=root',\$c);
            file_put_contents(\$f,\$c);
          "
          # Mirror secrets into .env for any bootstrap path that reads the file
          # before PHPUnit's xml env is applied (defense in depth vs CI flakes).
          sed -i 's/^FISCAL_AUDIT_SECRET=.*/FISCAL_AUDIT_SECRET=testing-fiscal-audit-secret-padding-48chars-ok/' .env
          sed -i 's/^FISCAL_Z_REPORT_SECRET=.*/FISCAL_Z_REPORT_SECRET=testing-fiscal-zreport-secret-padding-48chars-ok/' .env

      # [W9-AUDIT PROD-3] Migration drift guard.
      # If a developer adds a migration in a feature branch but forgets to
      # commit the corresponding model/test changes (or vice versa), or if a
      # migration file is malformed and would silently fail RefreshDatabase,
      # this step catches it BEFORE the test suite runs (which would otherwise
      # surface as opaque "table X not found" errors deep in a test run).
      #
      # `migrate --pretend` parses every migration file without executing it,
      # which validates syntax + class autoloading. `migrate:status` then
      # confirms every file maps to a registered batch.
      - name: Migration drift check
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: foodking_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --pretend --no-interaction
          php artisan migrate --no-interaction
          php artisan migrate:status

      - name: Run PHPUnit (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: foodking_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit --testdox

      - name: Run the explicit surface filtering contract test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: foodking_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit --filter FrontendSurfaceFilteringTest --testdox

      # P3 — bounded-cycle traceability (non-blocking): warn if recent RUN_*.md
      # lack EXECUTE_DELEGATION (run-cycle.md Step 2/4).
      - name: Delegation evidence audit (warn only)
        if: success() || failure()
        run: bash scripts/check-run-delegation-warn.sh

      # P4 / A05 — JSONL SHA256 = baseline versionnée ; toute modif `memory/episodes/*.jsonl`
      # exige de régénérer le manifest dans le même commit (bash scripts/memory-jsonl-manifest.sh).
      - name: Memory JSONL manifest (A05 --check)
        if: success() || failure()
        run: bash scripts/memory-jsonl-manifest.sh --check reports/memory/jsonl_manifest.json
