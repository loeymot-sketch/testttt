name: Vitest

# E06 (méga-checklist) : mêmes déclencheurs sur main + develop (push) que les PRs.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  vitest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run --reporter=verbose
