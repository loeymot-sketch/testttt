# LiteLLM Proxy Config — FoodKing Phase 2
# Route: Graphiti → LiteLLM (localhost:4000) → Kimi / Moonshot (chat) + embeddings (OpenAI-compatible)
# Doc: https://docs.litellm.ai/docs/proxy/configs
# Moonshot: LiteLLM lit `MOONSHOT_API_BASE` (global https://api.moonshot.ai/v1 vs Chine https://api.moonshot.cn/v1).
# fastembed/* n'est plus enregistré par LiteLLM 1.83+ (router → erreur) — ne pas l'utiliser ici.

model_list:

  # --- Chat completions → Moonshot (préfixe moonshot/ ; pas d'api_base ici : MOONSHOT_API_BASE suffit) ---
  - model_name: gpt-4o-mini
    litellm_params:
      model: moonshot/moonshot-v1-8k
      api_key: "os.environ/MOONSHOT_API_KEY"

  - model_name: gpt-4o
    litellm_params:
      model: moonshot/moonshot-v1-32k
      api_key: "os.environ/MOONSHOT_API_KEY"

  - model_name: gpt-4
    litellm_params:
      model: moonshot/moonshot-v1-32k
      api_key: "os.environ/MOONSHOT_API_KEY"

  - model_name: gpt-3.5-turbo
    litellm_params:
      model: moonshot/moonshot-v1-8k
      api_key: "os.environ/MOONSHOT_API_KEY"

  # --- Chat Graphiti → OpenRouter / Gemini [2026-08-10] ---
  # GRAPHITI_LLM_MODEL valait `gemini-3.1-pro`, un modele qui N'EXISTE PAS :
  # ni chez le proxy, ni dans les 399 modeles d'OpenRouter. Le serveur demarrait
  # tres bien et aurait echoue a la PREMIERE ecriture reelle, avec
  # « Invalid model name » — une panne invisible au demarrage.
  # google/gemini-2.5-flash existe, est rapide et bon marche, et supporte la
  # sortie structuree dont Graphiti a besoin pour extraire entites et relations.
  - model_name: gemini-2.5-flash
    litellm_params:
      model: openrouter/google/gemini-2.5-flash
      api_key: "os.environ/OPENROUTER_API_KEY"

  # --- Embeddings → OpenRouter (clé OPENROUTER_API_KEY + OPENROUTER_API_BASE dans ~/.cursor/mcp.json) ---
  # Doc LiteLLM: model "openrouter/openai/text-embedding-3-small" + os.environ/OPENROUTER_API_KEY
  - model_name: text-embedding-ada-002
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: text-embedding-3-small
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: "os.environ/OPENROUTER_API_KEY"

  - model_name: text-embedding-3-large
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: "os.environ/OPENROUTER_API_KEY"

litellm_settings:
  drop_params: true          # ignore params non supportés (ex: seed, logprobs)
  request_timeout: 60        # timeout par requête en secondes
  num_retries: 2             # retries auto sur timeout Moonshot
