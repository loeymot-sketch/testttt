# [GOAL-HEAL-SEC-001 2026-05-23] nginx defense-in-depth snippet.
# Phase B.3 Security RED-team finding B3.2-001 — Firebase Admin SDK
# service-account JSON was at public/file/service-account-file.json
# (web-accessible). File has been relocated to storage/app/firebase/
# (non-public via the firebase_private filesystem disk and a media
# collection pin on NotificationSetting). This nginx snippet is a
# belt-and-braces guard against future regressions or operator
# mistakes (e.g. someone scp'ing a key file into public/file/).
#
# DEPLOY: include from the FoodKing server block, e.g.
#     server {
#         root /var/www/foodking/public;
#         ...
#         include /etc/nginx/snippets/foodking-deny-sensitive-files.conf;
#     }
#
# Equivalent to public/.htaccess and public/file/.htaccess for nginx
# stacks (apache htaccess files are silently ignored under nginx).

# Recursively deny credential bundle extensions anywhere under document
# root (matches public/file/, public/storage/ symlink, future subdirs).
location ~* \.(pem|key|p12|pkcs12|crt|cer|ppk|asc|gpg)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny *.json specifically under /file/ — public/storage/ legitimately
# serves JSON-shaped media metadata from non-credential Spatie media
# collections, so a blanket *.json deny would break image catalogs.
location ~* ^/file/.*\.json$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Optional belt-and-braces — block /file/.htaccess from being served as
# plain text on stacks where dotfiles aren't already blocked.
location ~ /\.ht {
    deny all;
}
