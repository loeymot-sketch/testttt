<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borne Grill House — Prototype</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --kiosk-scale: 0.34;
    --kiosk-scale-solo: 0.44;
  }
  @media (max-width: 2400px) {
    :root { --kiosk-scale: 0.32; --kiosk-scale-solo: 0.42; }
  }
  @media (max-width: 2000px) {
    :root { --kiosk-scale: 0.28; --kiosk-scale-solo: 0.40; }
  }
  @media (max-width: 1700px) {
    :root { --kiosk-scale: 0.24; --kiosk-scale-solo: 0.38; }
  }
  @media (max-width: 1400px) {
    :root { --kiosk-scale: 0.20; --kiosk-scale-solo: 0.34; }
  }
  @media (max-width: 1100px) {
    :root { --kiosk-scale: 0.17; --kiosk-scale-solo: 0.30; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  body { background: #0a0a0c; color: #fff; }
  button { font-family: inherit; }

  /* Kiosk animations */
  @keyframes kioskPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  @keyframes kioskFadeZoom {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes kioskBounceIn {
    0% { opacity: 0; transform: scale(0.3); }
    60% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes kioskDot {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
  }
  @keyframes kioskSlideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Hide scrollbars on kiosk */
  ::-webkit-scrollbar { width: 0; height: 0; display: none; }

  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Tweak defaults — éditables via le panneau Tweaks
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "red",
    "showFrame": true,
    "sideBySide": true,
    "soloTheme": "dark"
  }/*EDITMODE-END*/;
</script>

<script type="text/babel" src="lib/kiosk-data.jsx"></script>
<script type="text/babel" src="lib/kiosk-ui.jsx"></script>
<script type="text/babel" src="lib/kiosk-screens.jsx"></script>
<script type="text/babel" src="lib/kiosk-app.jsx"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<window.KioskApp />);
</script>
</body>
</html>
